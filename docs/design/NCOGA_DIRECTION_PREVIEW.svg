<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">NCOGA design direction comparison</title>
  <desc id="desc">Three illustrative design systems for NCOGA: Contemporary Ghanaian Editorial recommended, Cultural Modernism, and Modern Institutional Heritage. All are proposals and use no organizational photography.</desc>
  <rect width="1600" height="1060" fill="#F4F1E9"/>
  <text x="72" y="85" fill="#123F32" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">NCOGA / DESIGN DIRECTION REVIEW</text>
  <text x="72" y="155" fill="#171C19" font-family="Georgia, serif" font-size="58">One institution. Three visual voices.</text>
  <text x="73" y="197" fill="#49534C" font-family="Arial, sans-serif" font-size="21">Illustrative compositions · official photographs and final typefaces pending approval</text>

  <!-- Direction A -->
  <rect x="72" y="240" width="460" height="740" fill="#FAF8F2" stroke="#DCD8CC" stroke-width="2"/>
  <rect x="72" y="240" width="460" height="10" fill="#123F32"/>
  <text x="102" y="295" fill="#123F32" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.4">A / RECOMMENDED</text>
  <text x="102" y="335" fill="#171C19" font-family="Georgia, serif" font-size="31">Ghanaian Editorial</text>
  <line x1="102" y1="360" x2="502" y2="360" stroke="#DCD8CC" stroke-width="1"/>
  <text x="102" y="395" fill="#123F32" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">NCOGA</text>
  <text x="398" y="395" fill="#49534C" font-family="Arial, sans-serif" font-size="12">ABOUT  YAY  NEWS</text>
  <text x="102" y="452" fill="#171C19" font-family="Georgia, serif" font-size="36">Rooted in Ghana.</text>
  <text x="102" y="493" fill="#171C19" font-family="Georgia, serif" font-size="36">Connected across</text>
  <text x="102" y="534" fill="#171C19" font-family="Georgia, serif" font-size="36">borders.</text>
  <text x="102" y="571" fill="#49534C" font-family="Arial, sans-serif" font-size="15">Editorial headline proposal · not an official slogan</text>
  <rect x="102" y="605" width="400" height="130" fill="#F0EBDF"/>
  <line x1="123" y1="625" x2="123" y2="715" stroke="#D9A227" stroke-width="5"/>
  <text x="145" y="661" fill="#123F32" font-family="Georgia, serif" font-size="19">Authentic NCOGA photography</text>
  <text x="145" y="687" fill="#49534C" font-family="Arial, sans-serif" font-size="15">placement and rights pending</text>
  <text x="102" y="782" fill="#123F32" font-family="Arial, sans-serif" font-size="15" font-weight="700">INSTITUTIONAL STORY</text>
  <line x1="102" y1="798" x2="502" y2="798" stroke="#DCD8CC"/>
  <text x="102" y="827" fill="#171C19" font-family="Georgia, serif" font-size="22">A council with history.</text>
  <text x="102" y="855" fill="#49534C" font-family="Arial, sans-serif" font-size="14">Warm space · strong reading rhythm · calm actions</text>
  <rect x="102" y="892" width="31" height="31" fill="#123F32"/><rect x="141" y="892" width="31" height="31" fill="#197047"/><rect x="180" y="892" width="31" height="31" fill="#D9A227"/><rect x="219" y="892" width="31" height="31" fill="#B3262E"/><rect x="258" y="892" width="31" height="31" fill="#FAF8F2" stroke="#DCD8CC"/>
  <text x="102" y="949" fill="#49534C" font-family="Arial, sans-serif" font-size="14">Newsreader + DM Sans candidate</text>

  <!-- Direction B -->
  <rect x="570" y="240" width="460" height="740" fill="#FFFFFF" stroke="#DCD8CC" stroke-width="2"/>
  <rect x="570" y="240" width="460" height="10" fill="#B3262E"/>
  <text x="600" y="295" fill="#B3262E" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.4">B / ALTERNATIVE</text>
  <text x="600" y="335" fill="#171C19" font-family="Georgia, serif" font-size="31">Cultural Modernism</text>
  <line x1="600" y1="360" x2="1000" y2="360" stroke="#DCD8CC" stroke-width="1"/>
  <rect x="600" y="384" width="120" height="48" fill="#123F32"/>
  <text x="618" y="415" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">NCOGA</text>
  <text x="846" y="412" fill="#171C19" font-family="Arial, sans-serif" font-size="12">ABOUT  YAY  NEWS</text>
  <text x="600" y="493" fill="#171C19" font-family="Arial, sans-serif" font-size="43" font-weight="800">A COUNCIL</text>
  <text x="600" y="541" fill="#171C19" font-family="Arial, sans-serif" font-size="43" font-weight="800">IN MOTION.</text>
  <rect x="600" y="573" width="400" height="165" fill="#D9A227"/>
  <rect x="600" y="573" width="120" height="165" fill="#B3262E"/>
  <rect x="600" y="693" width="400" height="45" fill="#123F32"/>
  <text x="744" y="637" fill="#171C19" font-family="Arial, sans-serif" font-size="17" font-weight="700">BOLD MODULAR</text>
  <text x="744" y="662" fill="#171C19" font-family="Arial, sans-serif" font-size="17" font-weight="700">SECTION RHYTHM</text>
  <text x="600" y="783" fill="#B3262E" font-family="Arial, sans-serif" font-size="15" font-weight="700">HIGH ENERGY</text>
  <line x1="600" y1="798" x2="1000" y2="798" stroke="#DCD8CC"/>
  <text x="600" y="827" fill="#171C19" font-family="Georgia, serif" font-size="22">Programs up front.</text>
  <text x="600" y="855" fill="#49534C" font-family="Arial, sans-serif" font-size="14">Graphic composition · stronger YAY voice</text>
  <rect x="600" y="892" width="31" height="31" fill="#B3262E"/><rect x="639" y="892" width="31" height="31" fill="#D9A227"/><rect x="678" y="892" width="31" height="31" fill="#123F32"/><rect x="717" y="892" width="31" height="31" fill="#171C19"/><rect x="756" y="892" width="31" height="31" fill="#FFFFFF" stroke="#DCD8CC"/>
  <text x="600" y="949" fill="#49534C" font-family="Arial, sans-serif" font-size="14">Characterful display + disciplined sans</text>

  <!-- Direction C -->
  <rect x="1068" y="240" width="460" height="740" fill="#F8F8F5" stroke="#DCD8CC" stroke-width="2"/>
  <rect x="1068" y="240" width="460" height="10" fill="#171C19"/>
  <text x="1098" y="295" fill="#49534C" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.4">C / ALTERNATIVE</text>
  <text x="1098" y="335" fill="#171C19" font-family="Georgia, serif" font-size="31">Institutional Heritage</text>
  <line x1="1098" y1="360" x2="1498" y2="360" stroke="#DCD8CC" stroke-width="1"/>
  <text x="1098" y="398" fill="#171C19" font-family="Georgia, serif" font-size="25" font-weight="700">NCOGA</text>
  <text x="1340" y="396" fill="#49534C" font-family="Arial, sans-serif" font-size="12">ABOUT  YAY  NEWS</text>
  <line x1="1098" y1="416" x2="1498" y2="416" stroke="#171C19" stroke-width="2"/>
  <text x="1098" y="472" fill="#171C19" font-family="Georgia, serif" font-size="33">National Council of</text>
  <text x="1098" y="511" fill="#171C19" font-family="Georgia, serif" font-size="33">Ghanaian Associations</text>
  <text x="1098" y="546" fill="#49534C" font-family="Arial, sans-serif" font-size="15">Organizational overview and verified history</text>
  <rect x="1098" y="581" width="400" height="158" fill="#123F32"/>
  <text x="1125" y="625" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">ARCHIVE / HISTORY</text>
  <text x="1125" y="674" fill="#FFFFFF" font-family="Georgia, serif" font-size="27">Four decades of</text>
  <text x="1125" y="708" fill="#FFFFFF" font-family="Georgia, serif" font-size="27">community service.</text>
  <text x="1098" y="783" fill="#171C19" font-family="Arial, sans-serif" font-size="15" font-weight="700">CLEAR RECORD</text>
  <line x1="1098" y1="798" x2="1498" y2="798" stroke="#DCD8CC"/>
  <text x="1098" y="827" fill="#171C19" font-family="Georgia, serif" font-size="22">Structured and enduring.</text>
  <text x="1098" y="855" fill="#49534C" font-family="Arial, sans-serif" font-size="14">Trust · chronology · minimal ornament</text>
  <rect x="1098" y="892" width="31" height="31" fill="#171C19"/><rect x="1137" y="892" width="31" height="31" fill="#123F32"/><rect x="1176" y="892" width="31" height="31" fill="#F0EBDF" stroke="#DCD8CC"/><rect x="1215" y="892" width="31" height="31" fill="#FFFFFF" stroke="#DCD8CC"/>
  <text x="1098" y="949" fill="#49534C" font-family="Arial, sans-serif" font-size="14">Restrained serif + highly legible sans</text>

  <text x="72" y="1024" fill="#49534C" font-family="Arial, sans-serif" font-size="15">For visual comparison only. No final mark, symbol, image, typeface, or color token has been approved.</text>
</svg>
